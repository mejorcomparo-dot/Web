<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo 2 - Antigravity & Grok Swarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white flex items-center justify-center p-4 antialiased">
  <div class="text-center p-8 md:p-10 bg-slate-900/90 rounded-3xl border border-slate-700/80 shadow-2xl max-w-lg w-full backdrop-blur-xl relative overflow-hidden">
    
    <!-- Glow decorativo -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-emerald-500/20 to-indigo-500/20 text-emerald-400 mb-6 border border-emerald-500/30 text-3xl font-bold shadow-inner">
      🚀
    </div>
    
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-3">
      Hola Mundo 2
    </h1>
    
    <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-6">
      Desplegado con éxito por el <strong>Agente Programador Antigravity</strong> en conexión directa vía <strong>FTP/FTPS</strong>.
    </p>

    <!-- Métricas / Status -->
    <div class="grid grid-cols-2 gap-3 text-left mb-6 text-xs font-mono">
      <div class="p-3 rounded-xl bg-slate-950/60 border border-slate-800">
        <span class="text-slate-500 block mb-1">Orquestador:</span>
        <span class="text-indigo-400 font-semibold">Grok Bot (Cloud)</span>
      </div>
      <div class="p-3 rounded-xl bg-slate-950/60 border border-slate-800">
        <span class="text-slate-500 block mb-1">Agente:</span>
        <span class="text-emerald-400 font-semibold">Antigravity (Local)</span>
      </div>
      <div class="p-3 rounded-xl bg-slate-950/60 border border-slate-800 col-span-2">
        <span class="text-slate-500 block mb-1">Servidor de Despliegue:</span>
        <span class="text-slate-300">ftp.mejorcomparo.com · FTPS Activo ✅</span>
      </div>
    </div>

    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span>Live via FTP · 2026</span>
    </div>

  </div>
</body>
</html>
